<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --amber:#F9CB42; --dark:#05261d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:'Inter','DejaVu Sans',sans-serif; color:#fff; position:relative;
    background:linear-gradient(180deg,#05261d 0%,#0a3d2f 40%,#0f5a44 75%,#1d7d57 100%); }
  #rays { position:absolute; left:-760px; top:-200px; width:2600px; height:2600px; border-radius:50%; opacity:.55;
    background:repeating-conic-gradient(from 8deg, rgba(200,245,222,.18) 0deg 6deg, transparent 6deg 18deg);
    -webkit-mask-image:radial-gradient(circle, transparent 0, #000 260px, #000 70%, transparent 100%); }
  #ep { position:absolute; top:250px; left:0; right:0; display:flex; justify-content:center; }
  #ep div { background:var(--amber); color:var(--dark); font-weight:900; font-size:40px; letter-spacing:4px; padding:14px 38px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  #logos { position:absolute; top:350px; left:0; right:0; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; padding:0 70px; }
  #logos i { width:170px; height:70px; background:#fff; border-radius:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  #logos img { max-width:138px; max-height:42px; }
  #photo { position:absolute; top:550px; left:70px; right:70px; height:490px; border-radius:40px; overflow:hidden; border:8px solid var(--amber); box-shadow:0 30px 70px rgba(0,0,0,.5); }
  #photo img { width:100%; height:100%; object-fit:cover; object-position:52% 22%; }
  #block { position:absolute; left:60px; right:60px; top:1075px; text-align:center; }
  .how { font-size:72px; font-weight:900; letter-spacing:-1.5px; line-height:1; }
  .logo { display:inline-flex; background:#fff; border-radius:28px; padding:20px 46px; margin:20px 0 16px; box-shadow:0 18px 50px rgba(0,0,0,.45); transform:rotate(-2deg); }
  .logo img { height:72px; display:block; }
  .sub { font-size:54px; font-weight:900; }
  .money { font-size:140px; font-weight:900; letter-spacing:-4px; line-height:1.05; color:var(--amber); text-shadow:0 6px 30px rgba(249,203,66,.35); }
  .stamp { display:inline-block; margin-top:18px; border:5px solid var(--amber); color:var(--amber); border-radius:18px; padding:8px 26px; font-size:36px; font-weight:900; letter-spacing:1px; transform:rotate(-2deg); background:rgba(5,38,29,.6); }
  #brand { position:absolute; bottom:60px; left:0; right:0; display:flex; justify-content:center; }
  #brand img { width:340px; }
</style></head>
<body>
  <div id="rays"></div>
  <div id="ep"><div>EPISODE 02/100</div></div>
  <div id="logos">
    <i><img src="../../logos/thedermaco-logo.png"></i><i><img src="../../logos/aqualogica-logo.png"></i><i><img src="../../logos/drsheths-logo.png"></i><i><img src="../../logos/lumineve-logo.png"></i>
    <i><img src="../../logos/bblunt-logo.png"></i><i><img src="../../logos/staze-logo.png"></i><i><img src="../../logos/reginaldmen-logo.png"></i><i><img src="../../logos/fikn-logo.png"></i>
  </div>
  <div id="photo"><img src="img/founders-green.jpg"></div>
  <div id="block">
    <div class="how">How does</div>
    <div class="sub" style="font-size:40px;color:#cdeedd;margin-top:10px">the company behind</div>
    <div class="logo"><img src="../../logos/mamaearth-logo.png"></div>
    <div class="sub">make</div>
    <div class="money">₹2,000 Cr+</div>
    <div class="sub">a year?</div>
    <div class="stamp">BUSINESS MODEL</div>
  </div>
  <div id="brand"><img src="../../logos/incbusiness-logo-white.png"></div>
</body></html>
