<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --amber:#F9CB42; --dark:#1c1b3a; --navy:#28275a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:'Inter','DejaVu Sans',sans-serif; color:#fff; position:relative; background:var(--dark); }
  #photo { position:absolute; inset:0; background:url('../presenter/presenter-full.jpg') center 30%/cover no-repeat; }
  #shadeTop { position:absolute; left:0; right:0; top:0; height:560px; background:linear-gradient(180deg, rgba(28,27,58,.92) 0%, rgba(28,27,58,.55) 60%, transparent 100%); }
  #shadeBot { position:absolute; left:0; right:0; bottom:0; height:1000px; background:linear-gradient(0deg, rgba(28,27,58,1) 0%, rgba(28,27,58,.96) 45%, rgba(40,39,90,.6) 75%, transparent 100%); }
  #ep { position:absolute; top:270px; left:0; right:0; display:flex; justify-content:center; }
  #ep div { background:var(--amber); color:var(--dark); font-weight:900; font-size:40px; letter-spacing:4px; padding:14px 38px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  #series { position:absolute; top:368px; left:0; right:0; text-align:center; font-size:34px; font-weight:800; letter-spacing:2px; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  #block { position:absolute; left:60px; right:60px; top:1000px; text-align:center; }
  .how { font-size:76px; font-weight:900; letter-spacing:-1.5px; line-height:1; text-shadow:0 4px 20px rgba(0,0,0,.5); }
  .logo { display:inline-flex; background:#fff; border-radius:30px; padding:22px 48px; margin:26px 0 22px; box-shadow:0 18px 50px rgba(0,0,0,.45); transform:rotate(-2deg); }
  .logo img { height:96px; display:block; }
  .money { font-size:150px; font-weight:900; letter-spacing:-4px; line-height:1; color:var(--amber); text-shadow:0 6px 30px rgba(249,203,66,.35); }
  .sub { font-size:58px; font-weight:900; margin-top:10px; }
  .free { display:inline-block; margin-top:26px; border:5px solid var(--amber); color:var(--amber); border-radius:18px; padding:8px 26px; font-size:38px; font-weight:900; letter-spacing:1px; transform:rotate(-2deg); background:rgba(28,27,58,.6); }
  #family { position:absolute; top:370px; left:0; right:0; text-align:center; }
  #family span { font-size:28px; font-weight:800; letter-spacing:2px; text-transform:uppercase; text-shadow:0 2px 12px rgba(0,0,0,.7); }
  #family .row { display:flex; justify-content:center; gap:16px; }
  #family i { width:210px; height:84px; background:#fff; border-radius:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  #family img { max-width:170px; max-height:52px; }
  #brand { position:absolute; bottom:120px; left:0; right:0; display:flex; justify-content:center; opacity:.95; }
  #brand img { width:360px; }
</style></head>
<body>
  <div id="photo"></div><div id="shadeTop"></div><div id="shadeBot"></div>
  <div id="ep"><div>EPISODE 01/100</div></div>
  <div id="block">
    <div class="how">How does</div>
    <div class="logo"><img src="../../logos/infoedge-logo.png"></div>
    <div class="sub" style="margin:0 0 6px">make</div>
    <div class="money">₹3,052 Cr</div>
    <div class="sub">a year?</div>
    <div class="free">JOB SEARCH IS FREE!</div>
  </div>
  <div id="family">
    <div class="row">
      <i><img src="../../logos/naukri-logo.png"></i><i><img src="../../logos/99acres-logo.png"></i>
      <i><img src="../../logos/shiksha-logo.png"></i><i><img src="../../logos/jeevansathi-logo.png"></i>
    </div>
  </div>
  <div id="brand"><img src="../../logos/incbusiness-logo-white.png"></div>
</body></html>
