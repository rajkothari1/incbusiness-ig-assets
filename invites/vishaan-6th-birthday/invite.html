<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vishaan's 6th Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&family=Baloo+2:wght@600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;overflow:hidden;font-family:'Fredoka',sans-serif;}
  .card{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 85%, rgba(255,79,154,.35) 0, rgba(255,79,154,0) 40%),
      radial-gradient(ellipse at 85% 55%, rgba(58,209,255,.28) 0, rgba(58,209,255,0) 40%),
      radial-gradient(circle at 50% 25%, rgba(140,110,255,.55) 0, rgba(140,110,255,0) 45%),
      linear-gradient(180deg,#0b0a2e 0%,#1b1460 45%,#2a1470 75%,#120a3a 100%);}
  .space{position:absolute;inset:0}
  .head{position:absolute;top:44px;width:100%;text-align:center;color:#fff}
  .small{font-family:'Orbitron';font-weight:900;font-size:40px;letter-spacing:6px;
    color:#ffd23f;text-shadow:0 0 18px rgba(255,210,63,.6)}
  .photo-wrap{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:700px;height:700px}
  .glow{position:absolute;inset:-40px;border-radius:50%;
    background:radial-gradient(circle, rgba(120,200,255,.55) 0, rgba(120,200,255,0) 65%)}
  /* helmet ring */
  .ring{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 25%,#ffffff 0,#e9eef8 35%,#b7c2d9 75%,#8c97b3 100%);
    box-shadow:0 30px 70px rgba(0,0,0,.55), inset 0 -10px 20px rgba(0,0,0,.25)}
  .ring::before{content:"";position:absolute;inset:22px;border-radius:50%;
    background:conic-gradient(#3ad1ff,#a35cff,#ff4f9a,#ffd23f,#3ad1ff)}
  .photo{position:absolute;inset:36px;border-radius:50%;
    background:url('vishaan.jpg') center 30%/112% no-repeat;
    box-shadow:inset 0 0 0 6px rgba(255,255,255,.9)}
  /* visor shine */
  .photo::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(135deg, rgba(255,255,255,.38) 0, rgba(255,255,255,0) 28%)}
  .bolt{position:absolute;width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#9aa6c2);box-shadow:inset 0 -3px 4px rgba(0,0,0,.3)}
  .six{position:absolute;right:-30px;bottom:20px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff3a8,#ffd23f 45%,#ff9a00);
    border:10px solid #fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 40px rgba(255,210,63,.7), 0 18px 30px rgba(0,0,0,.45);transform:rotate(10deg)}
  .six span{font-family:'Baloo 2';font-weight:800;font-size:190px;line-height:1;color:#ff4f9a;
    margin-top:28px;text-shadow:5px 5px 0 #2a1470}
  .name{position:absolute;top:812px;width:100%;text-align:center}
  .name h1{font-family:'Pacifico',cursive;font-weight:400;font-size:156px;line-height:1.15;color:#fff;
    text-shadow:0 7px 0 #3ad1ff, 0 14px 0 #a35cff, 0 0 50px rgba(120,200,255,.6)}
  .banner{position:relative;display:inline-block;margin-top:6px;padding:14px 56px;
    background:linear-gradient(90deg,#ffd23f,#ff9a3d);color:#1b1460;font-family:'Baloo 2';font-weight:800;font-size:68px;line-height:1.1;
    border-radius:60px;box-shadow:0 8px 0 #c2410c, 0 0 40px rgba(255,170,60,.45)}
  .tag{margin-top:28px;color:#fff;font-size:39px;font-weight:600}
  .tag b{color:#ffd23f}
  .info{position:absolute;left:66px;right:66px;top:1218px;
    background:rgba(255,255,255,.97);border-radius:44px;padding:34px 46px;
    box-shadow:0 0 0 6px rgba(58,209,255,.45), 0 24px 60px rgba(0,0,0,.5)}
  .row{display:flex;align-items:center;gap:28px}
  .row + .row{margin-top:22px;padding-top:22px;border-top:3px dashed #d9d3f5}
  .ic{flex:0 0 92px;height:92px;border-radius:26px;display:flex;align-items:center;justify-content:center}
  .ic svg{width:52px;height:52px}
  .k{font-size:26px;font-weight:600;color:#8a7fc0;letter-spacing:3px;text-transform:uppercase}
  .v{font-size:41px;font-weight:700;color:#1b1460;line-height:1.15}
  .v sup,.sub sup{font-size:.55em}
  .sub{font-size:28px;white-space:nowrap;font-weight:600;color:#5a4f95;margin-top:2px}
  .foot{position:absolute;bottom:90px;width:100%;text-align:center;color:#fff}
  .foot .fun{font-size:46px;font-weight:600;letter-spacing:1px}
  .foot .fun b{color:#3ad1ff;margin:0 12px}
  .foot .love{margin-top:10px;font-family:'Pacifico';font-size:42px;color:#fff3a8}
</style>
</head>
<body>
<div class="card">

  <svg class="space" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="pl1" cx="35%" cy="30%"><stop offset="0" stop-color="#ffd2b8"/><stop offset=".55" stop-color="#ff7a3d"/><stop offset="1" stop-color="#a8320c"/></radialGradient>
      <radialGradient id="pl2" cx="35%" cy="30%"><stop offset="0" stop-color="#c8f4ff"/><stop offset=".55" stop-color="#3ad1ff"/><stop offset="1" stop-color="#1563a8"/></radialGradient>
      <radialGradient id="pl3" cx="35%" cy="30%"><stop offset="0" stop-color="#ffc2dc"/><stop offset=".55" stop-color="#ff4f9a"/><stop offset="1" stop-color="#9c1452"/></radialGradient>
      <radialGradient id="moon" cx="35%" cy="30%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#dcdcef"/><stop offset="1" stop-color="#9a9ab8"/></radialGradient>
      <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a8"/><stop offset=".5" stop-color="#ffaa00"/><stop offset="1" stop-color="#ff4f1a" stop-opacity="0"/></linearGradient>
      <g id="st"><path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4Z"/></g>
    </defs>

    <!-- star field -->
    <g fill="#fff">
      <circle cx="40" cy="40" r="2"/><circle cx="150" cy="120" r="3"/><circle cx="260" cy="50" r="2"/><circle cx="330" cy="170" r="2.5"/>
      <circle cx="720" cy="40" r="2"/><circle cx="820" cy="150" r="3"/><circle cx="940" cy="60" r="2"/><circle cx="1040" cy="200" r="2.5"/>
      <circle cx="30" cy="330" r="2"/><circle cx="60" cy="620" r="3"/><circle cx="30" cy="880" r="2"/><circle cx="110" cy="1000" r="2.5"/>
      <circle cx="1050" cy="420" r="2"/><circle cx="1010" cy="700" r="2.5"/><circle cx="1060" cy="900" r="2"/><circle cx="960" cy="1060" r="3"/>
      <circle cx="30" cy="1180" r="2"/><circle cx="1050" cy="1200" r="2"/><circle cx="25" cy="1500" r="2.5"/><circle cx="1055" cy="1520" r="2.5"/>
      <circle cx="200" cy="1770" r="2"/><circle cx="880" cy="1760" r="2"/><circle cx="60" cy="1880" r="3"/><circle cx="1020" cy="1880" r="3"/>
      <circle cx="540" cy="1800" r="2" opacity=".6"/><circle cx="400" cy="1890" r="2" opacity=".7"/><circle cx="680" cy="1895" r="2" opacity=".7"/>
    </g>
    <g class="tw" fill="#fff3a8">
      <use href="#st" x="210" y="250"/><use href="#st" x="880" y="260" transform="translate(880 260) scale(1.3) translate(-880 -260)"/>
      <use href="#st" x="70" y="760"/><use href="#st" x="1020" y="800"/><use href="#st" x="60" y="1130"/><use href="#st" x="1030" y="1110"/>
    </g>
    <g class="tw2" fill="#fff">
      <use href="#st" x="100" y="460"/><use href="#st" x="990" y="520"/><use href="#st" x="330" y="1880"/><use href="#st" x="800" y="1760"/>
    </g>

    <!-- Saturn-style planet top-left -->
    <g class="rev" style="--cx:140px;--cy:370px;--r:22px;--d:5s"><g class="unrev"><g class="sat1"><g transform="translate(140 370) rotate(-20)">
      <ellipse rx="125" ry="28" fill="none" stroke="#ffd23f" stroke-width="10" opacity=".9"/>
      <circle r="78" fill="url(#pl1)"/>
      <clipPath id="cS"><circle r="78"/></clipPath>
      <g clip-path="url(#cS)"><rect x="-80" y="-12" width="160" height="14" fill="#ffd2b8" opacity=".25"/><rect x="-80" y="30" width="160" height="10" fill="#a8320c" opacity=".25"/><g class="slideS">
        <ellipse cx="-40" cy="-30" rx="14" ry="7" fill="#a8320c" opacity=".45"/><ellipse cx="20" cy="12" rx="12" ry="6" fill="#ffd2b8" opacity=".5"/><ellipse cx="50" cy="-45" rx="10" ry="5" fill="#a8320c" opacity=".4"/><ellipse cx="-10" cy="48" rx="16" ry="6" fill="#a8320c" opacity=".4"/>
        <ellipse cx="-200" cy="-30" rx="14" ry="7" fill="#a8320c" opacity=".45"/><ellipse cx="-140" cy="12" rx="12" ry="6" fill="#ffd2b8" opacity=".5"/><ellipse cx="-110" cy="-45" rx="10" ry="5" fill="#a8320c" opacity=".4"/><ellipse cx="-170" cy="48" rx="16" ry="6" fill="#a8320c" opacity=".4"/>
      </g></g>
      <path d="M-125 0 A125 28 0 0 0 125 0" fill="none" stroke="#ffd23f" stroke-width="10"/>
    </g></g></g></g>
    <!-- blue planet right -->
    <clipPath id="cB"><circle cx="975" cy="640" r="62"/></clipPath>
    <g class="rev ccw" style="--cx:975px;--cy:640px;--r:20px;--d:5s"><g class="unrev"><g class="fl3">
      <circle cx="975" cy="640" r="62" fill="url(#pl2)"/>
      <g clip-path="url(#cB)"><g class="slideB">
        <path d="M925 610 q50 -12 100 6" stroke="#ffffff" stroke-opacity=".35" stroke-width="7" fill="none"/>
        <path d="M920 650 q55 -10 110 8" stroke="#ffffff" stroke-opacity=".25" stroke-width="6" fill="none"/>
        <path d="M800 610 q50 -12 100 6" stroke="#ffffff" stroke-opacity=".35" stroke-width="7" fill="none"/>
        <path d="M795 650 q55 -10 110 8" stroke="#ffffff" stroke-opacity=".25" stroke-width="6" fill="none"/>
        <circle cx="950" cy="680" r="7" fill="#1563a8" opacity=".5"/><circle cx="825" cy="680" r="7" fill="#1563a8" opacity=".5"/>
      </g></g>
      <g transform="translate(975 640) scale(1 .4)"><g class="orbitM"><circle cx="100" cy="0" r="13" fill="url(#moon)"/></g></g>
    </g></g></g>
    <!-- moon left -->
    <clipPath id="cM"><circle cx="235" cy="1770" r="28"/></clipPath>
    <g class="rev" style="--cx:235px;--cy:1770px;--r:16px;--d:5s"><g class="unrev"><g class="fl3">
      <circle cx="235" cy="1770" r="28" fill="url(#moon)"/>
      <g clip-path="url(#cM)"><g class="spinM"><circle cx="226" cy="1763" r="6" fill="#b4b4cf"/><circle cx="245" cy="1780" r="5" fill="#b4b4cf"/><circle cx="238" cy="1752" r="3.5" fill="#b4b4cf"/></g></g>
    </g></g></g>
    <!-- small pink planet -->
    <clipPath id="cK"><circle cx="1018" cy="905" r="30"/></clipPath>
    <g class="rev ccw" style="--cx:1018px;--cy:905px;--r:18px;--d:5s"><g class="unrev"><g class="fl1">
      <circle cx="1018" cy="905" r="30" fill="url(#pl3)"/>
      <g clip-path="url(#cK)"><g class="spinK"><circle cx="1008" cy="895" r="6" fill="#9c1452" opacity=".5"/><circle cx="1028" cy="915" r="5" fill="#9c1452" opacity=".5"/><circle cx="1030" cy="893" r="3.5" fill="#ffc2dc" opacity=".7"/></g></g>
    </g></g></g>
    <!-- extra planets -->
    <defs>
      <radialGradient id="pl4" cx="35%" cy="30%"><stop offset="0" stop-color="#d4ffe0"/><stop offset=".55" stop-color="#3fcf8e"/><stop offset="1" stop-color="#11734a"/></radialGradient>
      <radialGradient id="pl5" cx="35%" cy="30%"><stop offset="0" stop-color="#e9d6ff"/><stop offset=".55" stop-color="#a35cff"/><stop offset="1" stop-color="#4b1d9e"/></radialGradient>
      <radialGradient id="pl6" cx="35%" cy="30%"><stop offset="0" stop-color="#fff6c2"/><stop offset=".55" stop-color="#ffd23f"/><stop offset="1" stop-color="#c98a00"/></radialGradient>
      <radialGradient id="earth" cx="35%" cy="30%"><stop offset="0" stop-color="#bfe9ff"/><stop offset=".55" stop-color="#2f8ff0"/><stop offset="1" stop-color="#123f8f"/></radialGradient>
    </defs>
    <!-- green planet left -->
    <clipPath id="cG"><circle cx="70" cy="610" r="48"/></clipPath>
    <g class="rev" style="--cx:70px;--cy:610px;--r:18px;--d:5s"><g class="unrev"><g class="fl2">
      <circle cx="70" cy="610" r="48" fill="url(#pl4)"/>
      <g clip-path="url(#cG)"><g class="spinG"><circle cx="55" cy="595" r="9" fill="#2ea86f" opacity=".7"/><circle cx="85" cy="628" r="6" fill="#2ea86f" opacity=".7"/><circle cx="88" cy="588" r="5" fill="#2ea86f" opacity=".6"/><circle cx="52" cy="630" r="4" fill="#2ea86f" opacity=".6"/></g></g>
    </g></g></g>
    <!-- tiny yellow planet top-left -->
    <clipPath id="cY"><circle cx="70" cy="175" r="24"/></clipPath>
    <g class="rev ccw" style="--cx:70px;--cy:175px;--r:14px;--d:5s"><g class="unrev"><g class="fl3">
      <circle cx="70" cy="175" r="24" fill="url(#pl6)"/>
      <g clip-path="url(#cY)"><g class="spinY"><circle cx="63" cy="168" r="5" fill="#c98a00" opacity=".5"/><circle cx="78" cy="183" r="4" fill="#c98a00" opacity=".5"/><circle cx="80" cy="166" r="3" fill="#fff6c2" opacity=".8"/></g></g>
    </g></g></g>
    <!-- big earth bottom-left, partly off-screen -->
    <g class="rev" style="--cx:40px;--cy:1890px;--r:14px;--d:5s"><g class="unrev"><g>
      <clipPath id="cE"><circle cx="40" cy="1890" r="130"/></clipPath>
      <circle cx="40" cy="1890" r="130" fill="url(#earth)"/>
      <g clip-path="url(#cE)"><g class="spinE">
        <path d="M-20 1800 q40 -20 70 10 q20 30 -10 50 q-40 10 -60 -20z" fill="#3fcf8e" opacity=".85"/>
        <path d="M70 1880 q40 -10 60 20 q0 40 -40 40 q-30 -20 -20 -60z" fill="#3fcf8e" opacity=".85"/>
        <path d="M-60 1930 q30 -20 60 0 q10 30 -20 40 q-40 0 -40 -40z" fill="#3fcf8e" opacity=".85"/>
        <path d="M120 1790 q30 -10 40 15 q-5 25 -30 20 q-20 -15 -10 -35z" fill="#3fcf8e" opacity=".85"/>
      </g></g>
      <circle cx="40" cy="1890" r="138" fill="none" stroke="#7fd6ff" stroke-opacity=".35" stroke-width="8"/>
    </g></g></g>
    <!-- ringed purple planet bottom-right -->
    <g class="rev ccw" style="--cx:965px;--cy:1820px;--r:20px;--d:5s"><g class="unrev"><g class="sat2"><g transform="translate(965 1820) rotate(18)">
      <ellipse rx="140" ry="30" fill="none" stroke="#3ad1ff" stroke-width="10" opacity=".9"/>
      <circle r="85" fill="url(#pl5)"/>
      <clipPath id="cP"><circle r="85"/></clipPath>
      <g clip-path="url(#cP)"><rect x="-90" y="-20" width="180" height="14" fill="#e9d6ff" opacity=".22"/><rect x="-90" y="25" width="180" height="12" fill="#4b1d9e" opacity=".3"/><g class="slideP">
        <ellipse cx="-35" cy="-38" rx="15" ry="7" fill="#4b1d9e" opacity=".45"/><ellipse cx="30" cy="10" rx="13" ry="6" fill="#e9d6ff" opacity=".45"/><ellipse cx="-5" cy="52" rx="17" ry="7" fill="#4b1d9e" opacity=".4"/><ellipse cx="50" cy="-45" rx="10" ry="5" fill="#e9d6ff" opacity=".45"/>
        <ellipse cx="-205" cy="-38" rx="15" ry="7" fill="#4b1d9e" opacity=".45"/><ellipse cx="-140" cy="10" rx="13" ry="6" fill="#e9d6ff" opacity=".45"/><ellipse cx="-175" cy="52" rx="17" ry="7" fill="#4b1d9e" opacity=".4"/><ellipse cx="-120" cy="-45" rx="10" ry="5" fill="#e9d6ff" opacity=".45"/>
      </g></g>
      <path d="M-140 0 A140 30 0 0 0 140 0" fill="none" stroke="#3ad1ff" stroke-width="10"/>
    </g></g></g></g>

    <!-- rocket top-right -->
    <g class="rocket"><g transform="translate(930 300) rotate(35)">
      <path d="M-18 70 Q0 150 18 70Z" fill="url(#flame)"/>
      <path d="M-26 40 L-50 80 L-24 70Z" fill="#ff4f9a"/>
      <path d="M26 40 L50 80 L24 70Z" fill="#ff4f9a"/>
      <path d="M0 -90 C34 -60 34 20 26 70 L-26 70 C-34 20 -34 -60 0 -90Z" fill="#f3f5fb"/>
      <path d="M0 -90 C14 -78 22 -64 26 -50 L-26 -50 C-22 -64 -14 -78 0 -90Z" fill="#ff4f9a"/>
      <circle cy="-10" r="15" fill="#3ad1ff" stroke="#1b1460" stroke-width="5"/>
      <rect x="-26" y="58" width="52" height="12" fill="#a35cff"/>
    </g></g>

    <!-- shooting star -->

  </svg>

  <div class="head"><div class="small">3 · 2 · 1 · BLAST OFF!</div></div>

  <div class="photo-wrap">
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="photo"></div>
    <div class="bolt" style="left:-4px;top:335px"></div>
    <div class="bolt" style="right:-4px;top:335px"></div>
    <div class="bolt" style="left:335px;top:-4px"></div>
    <div class="six"><span>6</span></div>
  </div>

  <div class="name">
    <h1>Vishaan's</h1>
    <div class="banner">6<sup style="font-size:.5em">th</sup> BIRTHDAY BASH!</div>
    <div class="tag">Our little <b>astronaut</b> is turning SIX — join the mission!</div>
  </div>

  <div class="info">
    <div class="row">
      <div class="ic" style="background:#ffe1ee">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff4f9a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8" cy="14" r="1" fill="#ff4f9a"/><circle cx="12" cy="14" r="1" fill="#ff4f9a"/><circle cx="16" cy="14" r="1" fill="#ff4f9a"/></svg>
      </div>
      <div><div class="k">Launch Date</div><div class="v">Tuesday, 3<sup>rd</sup> November 2026</div></div>
    </div>
    <div class="row">
      <div class="ic" style="background:#fff2c7">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f2a900" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </div>
      <div><div class="k">Launch Time</div><div class="v">6:30 PM – 8:30 PM</div></div>
    </div>
    <div class="row">
      <div class="ic" style="background:#e1ecff">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      </div>
      <div><div class="k">Landing Spot</div><div class="v">Zoreko Play Zone</div><div class="sub">3<sup>rd</sup> Floor, Gulshan One29 Mall, Sector 129, Noida – 201304</div></div>
    </div>
  </div>

  <div class="foot">
    <div class="fun">Games<b>✦</b>Cake<b>✦</b>Fun</div>
  </div>
</div>
</body>
</html>
