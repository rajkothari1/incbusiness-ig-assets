<h1>અર્પણ</h1>
<div>પરમ પૂજ્ય માતુશ્રી સ્વ. અનોપબહેન</div>
<div>તથા</div>
<div>પરમ પૂજ્ય પિતાશ્રી સ્વ. ખીમચંદભાઈને...</div>
<div class="ind">જેમણે સંસારના દુઃખો<br>વચ્ચે હસતાં શીખવ્યું.</div>
<div class="gap"></div>

<div>તથા</div>
<div>મો. મો. હાઈસ્કૂલના માન્યવર પૂજ્ય ગુરૂજનોને...</div>
<div class="ind">જેમણે અમારામાં શિક્ષણ<br>અને સંસ્કારના બીજ રોપ્યા.</div>
