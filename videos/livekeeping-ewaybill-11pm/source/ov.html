<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Hind;font-weight:600;src:url(fonts/hind-devanagari-600-normal.woff2)}
@font-face{font-family:Hind;font-weight:700;src:url(fonts/hind-devanagari-700-normal.woff2)}
@font-face{font-family:Pop;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:Pop;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2)}

html,body{margin:0;width:1080px;height:1920px;background:transparent;font-family:Pop,Hind,sans-serif}
.title{position:absolute;left:50px;right:50px;top:175px;text-align:center;color:#fff;font-family:Pop,Hind;font-weight:700;font-size:80px;line-height:1.2;text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 40px rgba(0,0,0,.7)}
.title b{color:#7DC242}.title .r{color:#FF5A4E}
.tag{display:inline-block;background:#FF3B30;color:#fff;font-size:44px;padding:6px 26px;border-radius:16px;margin-bottom:22px;text-shadow:none;font-family:Pop,Hind}
.tag.g{background:#7DC242;color:#111}
.sub{position:absolute;left:70px;right:70px;bottom:230px;text-align:center}

.sub i{font-style:normal;color:#ffd166}
.badge{position:absolute;left:50%;top:34px;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:22px;padding:12px 26px;box-shadow:0 8px 24px rgba(0,0,0,.35)}.badge img{display:block;width:300px}
