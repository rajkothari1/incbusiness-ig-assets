<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Pop;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:Pop;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2)}
@font-face{font-family:Hind;font-weight:700;src:url(fonts/hind-devanagari-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Pop,Hind,sans-serif}
#time{position:absolute;left:0;right:0;top:1020px;text-align:center;font-weight:800;font-size:190px;color:#fff;letter-spacing:4px;text-shadow:0 10px 0 #b3001b,0 0 60px rgba(255,40,40,.8)}
#q{position:absolute;left:50px;right:50px;top:200px;text-align:center;font-weight:800;font-size:82px;line-height:1.15;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.6),0 0 40px rgba(0,0,0,.8)}
#q b{color:#FFD23F}
#stamp{position:absolute;left:50%;top:1240px;width:820px;margin-left:-410px;text-align:center;font-weight:800;font-size:120px;color:#fff;background:#E0152B;border:12px solid #fff;border-radius:30px;padding:10px 0 4px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#flash{position:absolute;inset:0;background:#fff}
</style></head><body>
<div id="flash"></div>
<div id="time">11:00 PM</div>
<div id="q">Bina <b>E-Way Bill</b><br>truck nikla? 😱</div>
<div id="stamp">🚨 PENALTY!</div>
<script>
const $=i=>document.getElementById(i),cl=x=>Math.max(0,Math.min(1,x));
const back=x=>{x=cl(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
window.render=t=>{
 // white flash at start and at cut (1.0)
 const f=Math.max(1-cl(t/0.12), t>=0.9?1-cl((t-0.9)/0.15):0);$('flash').style.opacity=f*0.85;
 // 11:00 PM punch-in 0.05-1.0
 const a=back((t-0.05)/0.3);const sh=t<1?Math.sin(t*90)*Math.max(0,1-t*1.5)*14:0;
 $('time').style.opacity=t<0.9?cl((t-0.05)/0.08):0;$('time').style.transform=`translateX(${sh}px) scale(${0.3+0.7*a})`;
 // question 1.05+
 const b=back((t-0.95)/0.3);$('q').style.opacity=t>=0.95?cl((t-0.95)/0.1):0;$('q').style.transform=`scale(${0.5+0.5*b})`;
 // stamp slam at 1.6
 const s=cl((t-2.15)/0.18);$('stamp').style.opacity=t>=2.15?1:0;
 const sc=t<2.33?2.6-1.6*s:1+0.06*Math.sin((t-2.33)*14)*Math.max(0,1-(t-2.33)*2.5);
 $('stamp').style.transform=`rotate(-8deg) scale(${sc})`;
};window.DUR=3.2;render(0);
</script></body></html>
