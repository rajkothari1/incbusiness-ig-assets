<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="timeline.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const L=TL.lines;const BY={};L.forEach(l=>BY[l.i]=l);const FB={12:13};
const at=i=>BY[i]?BY[i].t0:(FB[i]!==undefined?at(FB[i]):1e9), end=i=>BY[i]?BY[i].t1:1e9, has=i=>!!BY[i];
const AV={x:880,y:1470,r:125};
const F='Inter, "Noto Color Emoji", sans-serif';
const YEL='#FFD54A', CY='#4FC3F7', RED='#FF5A4E', GRN='#5BE38B', PUR='#B388FF';

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,color='#fff',weight=800,align='center',alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px ${F}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.restore()}
function pop(t0,t,dur=.45){return eb(p(t,t0,t0+dur))}
function withT(x,y,s,a,fn){ctx.save();ctx.globalAlpha*=clamp(a);ctx.translate(x,y);ctx.scale(s,s);fn();ctx.restore()}
function glow(color,blur){ctx.shadowColor=color;ctx.shadowBlur=blur}
function card(x,y,w,h,col='rgba(255,255,255,0.06)',stroke='rgba(255,255,255,0.14)'){
  rr(x,y,w,h,32);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke()}
function atom(x,y,r,col,label,lc='#fff'){
  ctx.save();const g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);
  g.addColorStop(0,'#fff');g.addColorStop(.25,col);g.addColorStop(1,shade(col));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  if(label){ctx.font=`800 ${r*.9}px ${F}`;ctx.fillStyle=lc;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y+r*.05)}
  ctx.restore()}
function shade(c){const m={'#FF5A4E':'#8a1d16','#ffffff':'#8fa3b8','#e8eef5':'#7d8ea3','#555b66':'#1d2027','#4FC3F7':'#0b5c86','#FFD54A':'#9c7300','#B388FF':'#4a2a8a','#5BE38B':'#16723b'};return m[c]||'#333'}
function water(x,y,s,ang){ // H2O
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const d=s*1.05;
  atom(-d*.8,d*.62,s*.55,'#e8eef5');atom(d*.8,d*.62,s*.55,'#e8eef5');atom(0,0,s,'#FF5A4E');ctx.restore()}
function emoji(ch,x,y,size,a=1){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle='#000';ctx.font=`${size}px "Noto Color Emoji"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,x,y);ctx.restore()}
function wrap(s,maxW,size){ctx.font=`800 ${size}px ${F}`;const w=s.split(' ');let lines=[],cur='';
  for(const word of w){const t=cur?cur+' '+word:word;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=word}else cur=t}
  if(cur)lines.push(cur);return lines}

// ---------- background ----------
const R=rnd(7);const bgDots=[...Array(46)].map(()=>({x:R()*W,y:R()*H,r:2+R()*5,v:.2+R()*.6,ph:R()*6}));
function bg(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070a14');g.addColorStop(.55,'#0b1226');g.addColorStop(1,'#060912');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // soft color blobs
  const b=(x,y,r,c)=>{const rg=ctx.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H)};
  b(200+80*Math.sin(t*.2),500,600,'rgba(79,195,247,0.08)');b(900,1300+100*Math.cos(t*.15),650,'rgba(179,136,255,0.08)');
  // grid
  ctx.strokeStyle='rgba(255,255,255,0.025)';ctx.lineWidth=2;
  for(let x=0;x<=W;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=(t*12)%90;y<=H;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(const d of bgDots){const y=(d.y-t*d.v*30+H*5)%H;ctx.fillStyle=`rgba(160,200,255,${.08+.06*Math.sin(t+d.ph)})`;ctx.beginPath();ctx.arc(d.x+10*Math.sin(t*.5+d.ph),y,d.r,0,7);ctx.fill()}
}
function header(t){
  const a=p(t,0,.6);
  withT(0,0,1,a,()=>{
    rr(60,96,360,64,32);ctx.fillStyle='rgba(79,195,247,0.15)';ctx.fill();ctx.strokeStyle='rgba(79,195,247,0.5)';ctx.lineWidth=2;ctx.stroke();
    txt('CLASS 11 • CHEMISTRY',240,129,28,CY,800);
    txt('MOLE CONCEPT',1020,129,40,'#fff',900,'right');
  });
  // progress bar
  ctx.fillStyle='rgba(255,255,255,0.08)';rr(60,190,960,10,5);ctx.fill();
  ctx.fillStyle=YEL;rr(60,190,960*clamp(t/TL.total),10,5);ctx.fill();
}
function captions(t){
  let cur=null;for(const l of L){if(t>=l.t0-.12 && t<l.t1+.5)cur=l}
  if(!cur)return;
  const a=p(t,cur.t0-.12,cur.t0+.12)*(1-p(t,cur.t1+.3,cur.t1+.5));
  const size=56,lines=wrap(cur.cap,880,size),lh=size*1.3,h=lines.length*lh+56,y0=1640;
  const s=lerp(.92,1,eo(p(t,cur.t0-.12,cur.t0+.2)));
  withT(W/2,y0+h/2,s,a,()=>{
    ctx.translate(-W/2,-(y0+h/2));
    rr(70,y0,940,h,30);ctx.fillStyle='rgba(8,12,24,0.82)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.stroke();
    lines.forEach((ln,i)=>{
      ctx.font=`800 ${size}px ${F}`;const words=ln.split(' ');const tw=ctx.measureText(ln).width;let x=W/2-tw/2;
      for(const w of words){const hl=/[0-9²³ₐ₂]/.test(w)||(/[A-Z]{3,}/.test(w));
        ctx.fillStyle=hl?YEL:'#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(w,x,y0+28+lh*i+lh/2);x+=ctx.measureText(w+' ').width}
    })
  })
}
function title(s,t,t0,y=330,col='#fff',size=64){const k=pop(t0,t);withT(W/2,y,lerp(.7,1,k),p(t,t0,t0+.3),()=>txt(s,0,0,size,col,900))}

// ---------- scenes ----------
const SC=[];let prev=null;for(const l of L){if(l.s!==prev){SC.push({s:l.s,t0:l.t0-.35});prev=l.s}}
SC.forEach((s,i)=>s.t1=i<SC.length-1?SC[i+1].t0:TL.total+1);

const mols=(()=>{const r=rnd(3);return [...Array(26)].map(()=>({x:(r()-.5)*520,y:(r()-.5)*520,a:r()*6,ph:r()*6}))})();
function sHook(t){
  // glass
  const gk=eo(p(t,0,.7)), z=eio(p(t,1.0,1.6));
  const gx=lerp(540,250,z),gy=lerp(900,1260,z),gs=lerp(1,.45,z)*lerp(.6,1,gk);
  withT(gx,gy,gs,gk,()=>{
    // water
    ctx.save();ctx.beginPath();ctx.moveTo(-200,-260);ctx.lineTo(200,-260);ctx.lineTo(160,300);ctx.lineTo(-160,300);ctx.closePath();ctx.clip();
    const wg=ctx.createLinearGradient(0,-150,0,300);wg.addColorStop(0,'rgba(79,195,247,0.75)');wg.addColorStop(1,'rgba(20,90,200,0.9)');ctx.fillStyle=wg;
    ctx.beginPath();ctx.moveTo(-220,300);for(let x=-220;x<=220;x+=10)ctx.lineTo(x,-150+10*Math.sin(x/40+t*3));ctx.lineTo(220,300);ctx.closePath();ctx.fill();
    for(let i=0;i<8;i++){const by=300-((t*80+i*70)%450);ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-120+i*34,by,6+i%3*3,0,7);ctx.stroke()}
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=10;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(-200,-260);ctx.lineTo(-160,300);ctx.lineTo(160,300);ctx.lineTo(200,-260);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.18)';rr(-170,-220,24,420,12);ctx.fill();
  });
  if(t<1.3) title('1 glass paani 💧',t,.2,420,'#fff',70);
  // magnifier
  const m=eb(p(t,1.2,1.8));
  if(m>0){
    const cx=600,cy=760,r=330*m;
    ctx.save();ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=4;ctx.setLineDash([12,12]);
    ctx.beginPath();ctx.moveTo(gx+70,gy-110);ctx.lineTo(cx-r*.7,cy+r*.7);ctx.stroke();ctx.restore();
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle='rgba(10,40,80,0.9)';ctx.fill();ctx.clip();
    mols.forEach((o,i)=>{const x=cx+o.x*m+14*Math.sin(t*2.2+o.ph),y=cy+o.y*m+14*Math.cos(t*1.9+o.ph);
      water(x,y,26*m,o.a+t*.8*(i%2?1:-1));
    });
    // count 1,2,3
    [[1.8,'1'],[2.1,'2'],[2.4,'3']].forEach(([tt,n],k)=>{const o=mols[k*5+2];if(t>tt){const x=cx+o.x*m+14*Math.sin(t*2.2+o.ph),y=cy+o.y*m+14*Math.cos(t*1.9+o.ph);
      const s=pop(tt,t,.3);ctx.strokeStyle=YEL;ctx.lineWidth=6;ctx.beginPath();ctx.arc(x,y,48*s,0,7);ctx.stroke();txt(n,x+46,y-46,46*s,YEL,900)}});
    ctx.restore();
    ctx.strokeStyle='#fff';ctx.lineWidth=12;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
    ctx.lineWidth=34;ctx.lineCap='round';ctx.strokeStyle='#cfd8e3';ctx.beginPath();ctx.moveTo(cx+r*.72,cy+r*.72);ctx.lineTo(cx+r*.72+140*m,cy+r*.72+140*m);ctx.stroke();ctx.lineCap='butt';
    title('H₂O molecules 🔬',t,1.4,330,CY,60);
  }
  // counter card
  const ck=p(t,5.6,6.0);
  if(ck>0){
    const s=pop(5.6,t);
    withT(640,1300,lerp(.6,1,s),ck,()=>{
      card(-340,-120,680,240,'rgba(255,90,78,0.14)','rgba(255,90,78,0.6)');
      const spin=t<6.6?Math.floor((t*997)%1e9).toLocaleString('en-IN'):'~10¹⁷ SAAL!';
      txt(t<6.6?'Count: '+spin:'⏳ '+spin,0,-30,t<6.6?52:70,t<6.6?'#fff':YEL,900);
      txt('(1 molecule per second gino toh)',0,62,32,'rgba(255,255,255,0.7)',600);
    });
    if(t>6.7) emoji('🤯',920,1120,lerp(0,130,pop(6.7,t)));
  }
}

function sDozen(t){
  // phase A: dots grouping (line 2)
  const A=1-p(t,at(3)-.3,at(3));
  if(A>0){
    const r=rnd(11);const g=eio(p(t,at(2)+.6,at(2)+2.0));
    for(let i=0;i<36;i++){const sx=140+r()*800,sy=480+r()*700;const box=Math.floor(i/12),k=i%12;
      const tx=210+box*330+(k%4)*50,ty=760+Math.floor(k/4)*60;
      const x=lerp(sx,tx,g)+6*Math.sin(t*3+i)*(1-g),y=lerp(sy,ty,g)+6*Math.cos(t*3+i)*(1-g);
      withT(0,0,1,A*p(t,at(2)-.2,at(2)+.3),()=>atom(x,y,20,[CY,PUR,GRN][box]))}
    withT(0,0,1,A*g,()=>{for(let b=0;b<3;b++){ctx.strokeStyle='rgba(255,213,74,0.8)';ctx.lineWidth=5;ctx.setLineDash([14,10]);rr(170+b*330,720,240,200,24);ctx.stroke();ctx.setLineDash([]);txt('GROUP '+(b+1),285+b*330,970,32,YEL,800)}});
    withT(0,0,1,A,()=>title('Ek-ek nahi… GROUP mein gino!',t,at(2),360,'#fff',58));
  }
  if(t<at(3)-.3)return;
  // three rows
  const rows=has(4)?[{y:470,t0:at(3)},{y:830,t0:at(4)},{y:1190,t0:at(5)}]:[{y:520,t0:at(3)},{y:-9999,t0:1e9},{y:900,t0:at(5)}];
  rows.forEach((rw,i)=>{const k=pop(rw.t0-.15,t,.5);if(k<=0)return;
    withT(W/2,rw.y+150,lerp(.8,1,k),p(t,rw.t0-.15,rw.t0+.15),()=>{ctx.translate(-W/2,-(rw.y+150));
      const hot=i===2;card(70,rw.y,940,300,hot?'rgba(255,213,74,0.10)':'rgba(255,255,255,0.06)',hot?'rgba(255,213,74,0.7)':'rgba(255,255,255,0.14)');
      if(i===0){for(let j=0;j<12;j++){const s=pop(rw.t0+j*.08,t,.3);emoji('🍌',130+(j%6)*72+36,rw.y+95+Math.floor(j/6)*100,64*s)}
        txt('12 kele',330,rw.y+262,34,'rgba(255,255,255,.75)',700);
        const s2=pop(rw.t0+1.1,t);withT(800,rw.y+150,s2,s2,()=>{txt('1 DOZEN',0,-30,64,YEL,900);txt('= 12',0,45,56,'#fff',800)})}
      if(i===1){const n=Math.round(500*eo(p(t,rw.t0,rw.t0+1.4)));const sheets=Math.ceil(n/25);
        for(let j=0;j<sheets;j++){ctx.fillStyle=j%2?'#f4f6fb':'#dfe5ee';rr(170+j*1.5,rw.y+235-j*8,300,26,4);ctx.fill();ctx.strokeStyle='#9aa7b8';ctx.lineWidth=1;ctx.stroke()}
        txt(n+' kaagaz 📄',330,rw.y+50,38,'#fff',800);
        const s2=pop(rw.t0+1.1,t);withT(800,rw.y+150,s2,s2,()=>{txt('1 REAM',0,-30,64,YEL,900);txt('= 500',0,45,56,'#fff',800)})}
      if(i===2){const r=rnd(5);for(let j=0;j<40;j++){const x=110+r()*420,y=rw.y+40+r()*220;const s=pop(rw.t0+j*.04,t,.3);
          atom(x+5*Math.sin(t*3+j),y+5*Math.cos(t*2.5+j),15*s,[CY,RED,GRN,PUR,'#e8eef5'][j%5])}
        const rev=at(5)+2.6;const q=t<rev;
        if(q){const s2=pop(rw.t0+.5,t);withT(800,rw.y+150,s2,s2,()=>{txt('1 ???',0,-30,64,YEL,900);txt('= ?',0,45,60,'#fff',800)})}
        else{const s2=pop(rev,t,.5);withT(800,rw.y+150,lerp(1.4,1,s2),1,()=>{glow(YEL,40*(1-p(t,rev,rev+1.5))+10);txt('1 MOLE',0,-30,76,YEL,900);ctx.shadowBlur=0;txt('= atoms ka',0,45,40,'#fff',800);txt('darjan!',0,95,40,'#fff',800)})}}
    })});
  title('Ginti ki units',t,at(3)-.2,330,CY,56);
}

function sAvo(t){
  title('1 MOLE =',t,at(6),420,'#fff',90);
  const k=pop(at(6)+1.0,t,.6);
  withT(W/2,640,lerp(.5,1,k),p(t,at(6)+1.0,at(6)+1.2),()=>{glow(YEL,30);txt('6.022 × 10²³',0,0,128,YEL,900);ctx.shadowBlur=0});
  txt('particles (atoms / molecules / ions)',W/2,760,36,'rgba(255,255,255,.75)',600,'center',p(t,at(6)+1.6,at(6)+2));
  // digits
  const digits='602200000000000000000000';const n=Math.floor(clamp((t-(at(6)+2.6))/2.2)*digits.length);
  if(t>at(6)+2.4){
    card(70,840,940,250,'rgba(255,255,255,0.05)');
    let s='';for(let i=0;i<n;i++){s+=digits[i];const left=digits.length-1-i;if(left%3===0&&left>0)s+=','}
    txt(s,W/2,935,52,'#fff',800);
    if(n>=digits.length){txt('6022 ke baad 20 zero! 😱',W/2,1025,42,CY,800,'center',p(t,at(6)+5,at(6)+5.4))}
  }
  // Avogadro card
  const a=pop(at(7)+.8,t,.5);
  if(a>0) withT(W/2,1220,lerp(.6,1,a),clamp(a),()=>{
    card(-450,-120,900,240,'rgba(179,136,255,0.16)','rgba(179,136,255,0.7)');
    emoji('👨‍🔬',-320,0,130);
    txt('AVOGADRO NUMBER',60,-40,62,'#fff',900);
    txt('Nₐ = 6.022 × 10²³',60,45,54,YEL,900);
  });
}

function sRice(t){
  const v2=eio(p(t,at(9)-.4,at(9)+.2));
  // earth view
  if(v2<1) withT(0,0,1,1-v2,()=>{
    title('Kitna BADA hai? 🤔',t,at(8),360,'#fff',64);
    const cx=W/2,cy=920,R0=260,th=60*eo(p(t,at(8)+1.5,at(8)+4.2));
    // rice layer ring
    ctx.fillStyle='rgba(250,245,230,0.95)';ctx.beginPath();ctx.arc(cx,cy,R0+th,0,7);ctx.fill();
    const r=rnd(9);for(let i=0;i<260;i++){const a=r()*7,d=R0+r()*th;ctx.save();ctx.translate(cx+Math.cos(a)*d,cy+Math.sin(a)*d);ctx.rotate(a+r());ctx.fillStyle=i%3?'#fffaf0':'#e9dfc8';ctx.beginPath();ctx.ellipse(0,0,9,4,0,0,7);ctx.fill();ctx.restore()}
    emoji('🌍',cx,cy+12,R0*1.95);
    // falling grains
    if(t>at(8)+1.2){const r2=rnd(21);for(let i=0;i<70;i++){const ph=r2(),x=100+r2()*880;const y=((t-at(8))*500+ph*1600)%1300+250;
      if(Math.hypot(x-cx,y-cy)>R0+th+5){ctx.save();ctx.translate(x,y);ctx.rotate(ph*6+t);ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.ellipse(0,0,10,4.5,0,0,7);ctx.fill();ctx.restore()}}}
    txt('6.022 × 10²³ chawal ke daane 🍚',W/2,1330,46,YEL,900,'center',p(t,at(8)+1,at(8)+1.4));
  });
  if(v2>0) withT(0,0,1,v2,()=>{
    const gy=1380;ctx.fillStyle='#2b6b3a';ctx.fillRect(0,gy,W,30);ctx.fillStyle='#3b2a1d';ctx.fillRect(0,gy+30,W,60);
    // building
    const bx=600,bw=300,fh=88;
    for(let f=0;f<10;f++){const y=gy-(f+1)*fh;ctx.fillStyle=f%2?'#3c4a6b':'#33405e';ctx.fillRect(bx,y,bw,fh);
      for(let w=0;w<4;w++){ctx.fillStyle=(f*4+w)%3?'#ffe08a':'#8fb3ff';ctx.fillRect(bx+22+w*70,y+22,46,44)}
      txt(String(f+1),bx+bw+40,y+fh/2,32,'rgba(255,255,255,.6)',700)}
    ctx.fillStyle='#26324d';ctx.fillRect(bx-10,gy-10*fh-20,bw+20,24);
    // rice level rising
    const lvl=10*fh*eo(p(t,at(9),at(9)+1.8));
    ctx.fillStyle='rgba(250,245,230,0.93)';ctx.fillRect(60,gy-lvl,500,lvl);
    const r=rnd(4);for(let i=0;i<Math.floor(lvl/3);i++){const x=70+r()*480,y=gy-r()*lvl;ctx.save();ctx.translate(x,y);ctx.rotate(r()*6);ctx.fillStyle='#e6dcc4';ctx.beginPath();ctx.ellipse(0,0,8,3.5,0,0,7);ctx.fill();ctx.restore()}
    if(lvl>80)txt('🍚 chawal ki parat',310,gy-lvl+50,38,'#3a2f1f',900);
    const s=pop(at(9)+1.6,t);withT(W/2,300,lerp(.6,1,s),s,()=>{glow(YEL,25);txt('≈ 10 MANZIL UNCHI!',0,0,74,YEL,900)});
    txt('(poori dharti par!)',W/2,375,40,'rgba(255,255,255,.8)',700,'center',s);
  });
}

function scale(t,tilt,leftFn,rightFn){
  const cx=W/2,cy=820;
  ctx.fillStyle='#8d99ae';rr(cx-14,cy,28,420,10);ctx.fill();rr(cx-160,cy+410,320,36,14);ctx.fill();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt);
  ctx.fillStyle='#cfd8e3';rr(-380,-12,760,24,12);ctx.fill();
