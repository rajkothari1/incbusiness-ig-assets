<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
body { font-family: 'Poppins', sans-serif; color: #fff; position: relative; }
.abs { position: absolute; }
.y { color: #EDB516; }
.bg { position: absolute; inset: -80px; opacity: 0; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); }
#card { left: 36px; right: 36px; top: 560px; height: 1040px; background: rgba(8,9,12,.80); border: 2px solid rgba(255,255,255,.12); border-radius: 36px; box-shadow: 0 30px 90px rgba(0,0,0,.55); backdrop-filter: blur(6px); }
#grid { position: absolute; left: 26px; right: 26px; top: 22px; bottom: 22px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; column-gap: 24px; }
.row { display: flex; align-items: center; gap: 18px; padding: 0 12px; border-radius: 18px; min-width: 0; position: relative; }
.row .n { width: 40px; flex: none; font-size: 28px; font-weight: 800; color: #EDB516; text-align: right; }
.row img { width: 70px; height: 70px; flex: none; border-radius: 16px; background: #fff; object-fit: contain; padding: 4px; box-sizing: border-box; }
.row .t { min-width: 0; flex: 1; }
.row .nm, .row .ln { overflow: hidden; }
.row .nm { font-size: 40px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
.row .ln { font-size: 30px; font-weight: 600; line-height: 1.25; color: #EDB516; white-space: nowrap; }
.row .hl { position: absolute; inset: -6px -8px; border-radius: 22px; opacity: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(237,181,22,.34) 0%, rgba(237,181,22,.12) 70%, rgba(237,181,22,.06) 100%);
  border: 3px solid #EDB516;
  box-shadow: 0 0 46px rgba(237,181,22,.55), 0 0 14px rgba(237,181,22,.8), 0 18px 40px rgba(0,0,0,.6), inset 0 0 24px rgba(237,181,22,.18); }
.row .hl::before { content: ''; position: absolute; left: -3px; top: 18%; bottom: 18%; width: 9px; border-radius: 0 8px 8px 0; background: #EDB516; box-shadow: 0 0 18px #EDB516; }
.row > *:not(.hl) { position: relative; }
#rule { left: 50%; top: 585px; width: 2px; height: 990px; background: rgba(255,255,255,.10); }
</style>
</head>
<body>
<div id="bgs"></div>
<div class="abs" id="head" style="left: 40px; right: 40px; top: 290px; text-align: center">
<img id="logo" src="assets/logo-light.png" style="height: 38px; display: block; margin: 0 auto" alt="">
<h1 id="title" style="margin: 18px 0 0; font-size: 84px; line-height: 1.02; font-weight: 900; white-space: nowrap; display: inline-block"></h1>
<div id="part" style="margin-top: 8px; font-size: 44px; font-weight: 800; color: #EDB516"></div>
</div>
<div id="card" class="abs"><div id="grid"></div></div>
<div id="rule" class="abs"></div>

<script>
// Instagram AI tools "list" reel: every tool and its website on one screen, music only.
// The list never moves; backgrounds change behind it and a soft highlight walks down the rows.
let R = {}, END = 0;
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const back = x => { x = clamp(x, 0, 1); const c = 2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// five looks; each one has 3 blobs that drift
const LOOKS = [
  {base: '#140f02', blobs: ['#EDB516', '#b35d00', '#5c3a00']},
  {base: '#030a1c', blobs: ['#1f6bff', '#7a2cff', '#00b3ff']},
  {base: '#02140f', blobs: ['#00c389', '#0a7cff', '#00e0c6']},
  {base: '#16030f', blobs: ['#ff2f7a', '#ff8a00', '#8a1cff']},
  {base: '#0b0b0b', blobs: ['#EDB516', '#ffffff', '#3a3a3a']},
];

function setup(d) {
  R = d; END = d.END;
  $('title').innerHTML = d.title;
  $('part').textContent = d.part || '';
  const rows = Math.ceil(d.tools.length / 2), H = rows * 165 + 44;   // at most 6 rows a column, so names and links stay big
  $('card').style.height = H + 'px'; $('rule').style.height = (H - 50) + 'px';
  $('grid').style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  $('grid').innerHTML = d.tools.map((t, i) => `<div class="row" id="r${i}"><div class="hl"></div><div class="n">${(d.start || 1) + i}</div><img src="src/${t.icon}.png" alt=""><div class="t"><div class="nm">${t.name}</div><div class="ln">${t.link}</div></div></div>`).join('');
  $('bgs').innerHTML = LOOKS.map((L, i) => `<div class="bg" id="bg${i}" style="background:${L.base}">${L.blobs.map((c, j) => `<div class="blob" id="b${i}_${j}" style="background:${c};width:${700 + j * 120}px;height:${700 + j * 120}px"></div>`).join('')}</div>`).join('');
}

// shrink any name or link that would not fit its column (call once the fonts have loaded)
function fit() {
  const h = $('title'); let hs = 84; h.style.fontSize = hs + 'px';
  while (h.offsetWidth > 990 && hs > 50) { hs -= 2; h.style.fontSize = hs + 'px'; }
  document.querySelectorAll('.nm, .ln').forEach(el => {
    el.style.fontSize = ''; let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && fs > 16) { fs -= 1; el.style.fontSize = fs + 'px'; }
  });
}

function render(t) {
  const n = LOOKS.length, per = R.per, x = 0.6;
  // background: crossfade between looks every `per` seconds, blobs drift
  LOOKS.forEach((L, i) => {
    const k = Math.floor(t / per), f = (t - k * per);
    let o = 0;
    if (k % n === i) o = 1;
    if ((k + 1) % n === i && f > per - x) o = ease((f - (per - x)) / x);
    $('bg' + i).style.opacity = o;
    L.blobs.forEach((_, j) => {
      const a = t * (.35 + j * .12) + i * 2 + j * 2.1;
      const cx = 540 + Math.cos(a) * (260 + j * 60) - (350 + j * 60);
      const cy = [520, 1100, 1650][j] + Math.sin(a * 1.3) * 220 - (350 + j * 60);
      const b = $(`b${i}_${j}`); b.style.left = cx + 'px'; b.style.top = cy + 'px'; b.style.opacity = .75;
    });
  });
  // intro: header and rows pop in during the first ~2 s, then stay put
  const hp = back((t - .05) / .5);
  $('head').style.opacity = clamp((t - .05) * 4, 0, 1); $('head').style.transform = `scale(${.85 + .15 * hp})`;
  $('card').style.opacity = clamp((t - .25) * 4, 0, 1); $('card').style.transform = `translateY(${(1 - ease((t - .25) / .5)) * 60}px)`;
  $('rule').style.opacity = clamp((t - .4) * 4, 0, 1);
  R.tools.forEach((_, i) => {
    const p = (t - (.45 + i * .07)) / .35, el = $('r' + i);
    const hv = t > R.hlStart ? clamp(1 - Math.abs((t - R.hlStart) / R.hlStep - i) * 1.2, 0, 1) : 0;   // how selected this row is
    el.style.opacity = clamp(p * 3, 0, 1);
    el.style.transform = `translateX(${(1 - back(p)) * (i < Math.ceil(R.tools.length / 2) ? -80 : 80)}px) scale(${1 + .06 * ease(hv)})`;
    el.style.zIndex = hv > 0 ? 5 : 1;
    // highlight walks down the list once the rows are in
    const h = (t - R.hlStart) / R.hlStep;
    el.querySelector('.hl').style.opacity = hv;
  });
  document.body.style.opacity = 1 - ease((t - (END - .4)) / .4);
}
</script>
</body>
</html>
